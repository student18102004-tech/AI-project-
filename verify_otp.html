<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Email - CareerMatch AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Verify Your Email</h2>
            <p class="subtitle">We've sent a 6-digit code to your email.</p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" style="color: red; margin-bottom: 10px;">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('verify_otp_route') }}">
                <div class="form-group">
                    <label>Verification Code (OTP)</label>
                    <input type="text" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6" style="letter-spacing: 5px; text-align: center; font-size: 20px;">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">Verify Email</button>
            </form>
        </div>
    </div>
</body>
</html>

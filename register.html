<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerMatch AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #050505;
            /* Magenta Grid Background */
            background-image: 
                linear-gradient(rgba(255, 0, 234, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 234, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            padding: 20px 0;
        }

        .form-container {
            background: #0d0d0d;
            border: 1px solid #333;
            border-top: 4px solid #ff00ea; /* Magenta top border */
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 0, 234, 0.05);
            width: 100%;
            max-width: 480px;
            position: relative;
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Corner Accents */
        .form-container::before, .form-container::after {
            content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid #ff00ea;
        }
        .form-container::before { top: -1px; left: -1px; border-bottom: none; border-right: none; }
        .form-container::after { bottom: -1px; right: -1px; border-top: none; border-left: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-top: 0; margin-bottom: 30px; font-weight: 700; color: #ff00ea; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 0, 234, 0.4); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #ff00ea; letter-spacing: 1px; text-transform: uppercase; }
        
        /* Dark Inputs */
        .form-group input { 
            width: 100%; 
            padding: 12px 15px; 
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Neon Focus Effect */
        .form-group input:focus {
            outline: none;
            border-color: #ff00ea;
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.3), inset 0 0 5px rgba(255, 0, 234, 0.1);
            background: #0a0a0a;
        }

        .btn-primary { 
            background: transparent; 
            color: #ff00ea; 
            padding: 14px; 
            border: 1px solid #ff00ea; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.2), inset 0 0 10px rgba(255, 0, 234, 0.1);
            font-family: 'Rajdhani', sans-serif;
        }
        
        .btn-primary:hover { 
            background: #ff00ea;
            color: #000;
            box-shadow: 0 0 25px rgba(255, 0, 234, 0.6);
        }

        .links { 
            text-align: center;
            margin-top: 25px; 
            font-size: 15px;
            color: #666;
        }
        .links a { color: #00f3ff; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .links a:hover { text-shadow: 0 0 10px rgba(0,243,255,0.6); }

        /* Alerts */
        .alert { padding: 12px; margin-bottom: 20px; border-left: 4px solid #ff00ea; background: #1a1a1a; color: #ff00ea; font-size: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Initialize_Account</h2>
        
        <!-- Flash Messages (Errors) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            
            <div class="form-group">
                <label for="full_name">Full_Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email_Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Create_Password</label>
                <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
            </div>

            <button type="submit" class="btn-primary">Register_&_Send_OTP</button>
        </form>

        <div class="links">
            Already registered? <a href="{{ url_for('login') }}">Access_System</a>
        </div>
    </div>
</body>
</html>

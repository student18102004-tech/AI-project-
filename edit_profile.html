<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - CareerMatch AI</title>
    <style>
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; }
        .auth-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; box-sizing: border-box; }
        .btn-primary { background-color: #1976d2; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-primary:hover { background-color: #1565c0; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Edit Your Profile</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('edit_profile') }}">
            
            <div class="form-group">
                <label for="education">Education</label>
                <input type="text" id="education" name="education" placeholder="e.g. BS Software Engineering"
                       value="{{ profile['education'] if profile and profile['education'] is defined else '' }}" required>
            </div>

            <div class="form-group">
                <label for="skills">Skills <small>(separate with semicolons ;)</small></label>
                <textarea id="skills" name="skills" rows="3" placeholder="Python; SQL; HTML" required>{{ profile['skills'] if profile and profile['skills'] is defined else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level</label>
                <select id="experience" name="experience" required>
                    <option value="" disabled {% if not profile or not profile['experience'] %}selected{% endif %}>Select...</option>
                    {% for level in experience_levels %}
                        <option value="{{ level }}" {% if profile and profile['experience'] == level %}selected{% endif %}>{{ level }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="interests">Career Interests <small>(separate with semicolons ;)</small></label>
                <textarea id="interests" name="interests" rows="2" placeholder="Web Development; AI" required>{{ profile['interests'] if profile and profile['interests'] is defined else '' }}</textarea>
            </div>

            <button type="submit" class="btn-primary">Save Profile</button>
            <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel and Go Back</a>
        </form>
    </div>
</body>
</html>
